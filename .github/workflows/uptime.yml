name: Uptime monitor

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  SITE_URL: ${{ vars.SITE_URL || 'https://kesa-lifestyle.vercel.app' }}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe the live site
        id: probe
        continue-on-error: true
        run: |
          set -e
          fail=""
          for path in /api/health/ / /women/ /checkout/; do
            code=$(curl -s -o /dev/null --max-time 30 -w '%{http_code}' "$SITE_URL$path" || echo 000)
            echo "$code $path"
            [ "$code" = "200" ] || fail="$fail $path($code)"
          done
          if [ -n "$fail" ]; then echo "failed=$fail" >> "$GITHUB_OUTPUT"; exit 1; fi

      - name: Open or update an incident issue
        if: steps.probe.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "🚨 Site check failing: kesa-lifestyle.vercel.app";
            const failed = "${{ steps.probe.outputs.failed }}" || "unknown";
            const body = `Automated uptime probe failed at ${new Date().toISOString()}.\n\nFailing: ${failed}\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: issues } = await github.rest.issues.listForRepo({ ...context.repo, state: "open", labels: "incident" });
            const existing = issues.find((i) => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ ...context.repo, title, body, labels: ["incident"] });
            }

      - name: Close the incident when healthy again
        if: steps.probe.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "🚨 Site check failing: kesa-lifestyle.vercel.app";
            const { data: issues } = await github.rest.issues.listForRepo({ ...context.repo, state: "open", labels: "incident" });
            for (const i of issues.filter((i) => i.title === title)) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: i.number, body: `Recovered at ${new Date().toISOString()}.` });
              await github.rest.issues.update({ ...context.repo, issue_number: i.number, state: "closed" });
            }

      - name: Fail the run if the probe failed
        if: steps.probe.outcome == 'failure'
        run: exit 1
